name: GFP-OPT P1 Export Exact Public Source Runner Bundle
on:
  pull_request:
    paths:
      - '.github/workflows/gfp-opt-p1-export-source-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
      - name: Print immutable Git blob evidence
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            Tools/build_governed_clean_delivery_v1.py \
            Tools/build_clean_delivery.py \
            Tools/content_package_guard.py \
            Tools/rehearse_existing_stage5_archive_v1.py \
            Verification/check_active_stage5_policy_v1.py \
            Verification/validate_unified_vocabulary_projection_v1_1_0.py \
            Prompt/GLOBAL-POLICY-REGISTRY-v1.0.0.json; do
            test -f "$file"
            printf '%s ' "$file"
            git hash-object "$file"
          done
      - name: Upload only already-tracked source files for isolated local replay
        uses: actions/upload-artifact@v4
        with:
          name: gfp-opt-p1-exact-source-checkout
          retention-days: 1
          if-no-files-found: error
          path: |
            Tools/build_governed_clean_delivery_v1.py
            Tools/build_clean_delivery.py
            Tools/content_package_guard.py
            Tools/rehearse_existing_stage5_archive_v1.py
            Verification/check_active_stage5_policy_v1.py
            Verification/validate_unified_vocabulary_projection_v1_1_0.py
            Prompt/GLOBAL-POLICY-REGISTRY-v1.0.0.json
