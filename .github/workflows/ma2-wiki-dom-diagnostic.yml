name: MA2 Wiktionary parser diagnostic
on:
  push:
    branches: [repair/menschen-a2-rich-card-floor]
    paths: ['.github/workflows/ma2-wiki-dom-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import importlib.util,json,requests,sys
          from pathlib import Path
          p=Path('Workspaces/menschen-a2/tools')
          sys.path.insert(0,str(p.resolve()))
          spec=importlib.util.spec_from_file_location('v4',p/'enrich_rich_card_v4.py')
          v4=importlib.util.module_from_spec(spec); spec.loader.exec_module(v4)
          s=requests.Session()
          for lemma in ['klettern','übergeben','bestehen','übernachten','verkaufen']:
              print('\n###',lemma)
              print(json.dumps(v4.wiki_fetch_current(s,lemma),ensure_ascii=False,indent=2))
          PY
