name: MA2 Verbformen DOM diagnostic
on:
  push:
    branches: [repair/menschen-a2-rich-card-floor-v8]
    paths: ['.github/workflows/ma2-verbformen-dom-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          url='https://www.verbformen.de/konjugation/beispiele/kuscheln.htm'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=20);print('HTTP',r.status_code,len(r.text))
          s=BeautifulSoup(r.text,'html.parser')
          for q in s.find_all('q'):
            if not re.search('kuschel',q.get_text(' ',strip=True),re.I): continue
            print('\nQ',repr(q.get_text(' ',strip=True)))
            p=q
            for level in range(1,6):
              p=p.parent
              if p is None:break
              txt=p.get_text(' ',strip=True)
              print('A',level,p.name,p.get('class'),repr(txt)[:900])
          print('\nCANDIDATE SMALL BLOCKS')
          for tag in s.find_all(['li','div','p']):
            txt=tag.get_text(' ',strip=True)
            if re.search(r'\b(?:Er|Sie|Ich|Tom|Als)\b.*kuschel',txt,re.I) and 10<len(txt)<350:
              print(tag.name,tag.get('class'),repr(txt))
          PY
