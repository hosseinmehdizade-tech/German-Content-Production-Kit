name: NVV Batch0003 materialization recovery (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled automatic recovery
        shell: bash
        run: |
          echo 'Automatic Batch0003 ZIP/Base64 materialization is intentionally disabled.'
          echo 'Reason: project operating mode is artifact-first / async Git; generated checkpoint ZIPs are no longer reconstructed through GitHub Actions.'
          echo 'Use the newest verified portable checkpoint from Project/Library/current delivery, verify its SHA-256 and internal manifest locally, then sync only compact metadata/checkpoints to Git at a meaningful boundary.'
          exit 1
