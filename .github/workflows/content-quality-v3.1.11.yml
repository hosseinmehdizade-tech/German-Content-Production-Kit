name: Content quality active authority
on:
  push:
    branches: [main, fix/content-quality-v3.1.11, fix/source-sense-marker-and-tsv-contract]
    paths:
      - 'README.md'
      - 'Prompt/**'
      - 'Verification/**'
      - '.github/workflows/content-quality-v3.1.11.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'Prompt/**'
      - 'Verification/**'
      - '.github/workflows/content-quality-v3.1.11.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lexical quality regressions
        run: |
          python Verification/test_lexical_quality_v1_0_0.py
          python Verification/test_lexical_quality_v1_0_1.py
      - name: Validate active completeness/product profiles
        run: |
          python -m json.tool Prompt/MENSCHEN-A1-CONTENT-COMPLETENESS-v1.1.0.json > /dev/null
          python -m json.tool Prompt/GERMAN-RICH-CARD-CONTENT-COMPLETENESS-v1.1.0.json > /dev/null
          test -f Prompt/GERMAN-RICH-CARD-PRODUCT-FLOOR-v1.0.0.json && python -m json.tool Prompt/GERMAN-RICH-CARD-PRODUCT-FLOOR-v1.0.0.json > /dev/null || true
      - name: Active entrypoint consistency without version hardcoding
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          readme=Path('README.md').read_text(encoding='utf-8')
          m=re.search(r'Prompt/(START-PROMPT-v[0-9.]+\.md)',readme)
          assert m, 'README must name an active START-PROMPT'
          start_path=Path('Prompt')/m.group(1)
          assert start_path.is_file(),start_path
          start=start_path.read_text(encoding='utf-8')
          mm=re.search(r'CONTENT-GENERATION-MASTER-PROMPT-v[0-9.]+\.md',start)
          assert mm,'active START prompt must name its Master Prompt'
          master_path=Path('Prompt')/mm.group(0)
          assert master_path.is_file(),master_path
          master=master_path.read_text(encoding='utf-8')
          runbook=Path('Prompt/NEW-SOURCE-AGENTIC-RUNBOOK-v1.0.0.md').read_text(encoding='utf-8')
          assert 'NEW-SOURCE-AGENTIC-RUNBOOK-v1.0.0.md' in start
          assert 'GERMAN-RICH-CARD-CONTENT-COMPLETENESS-v1.1.0.json' in start
          assert 'direct tsv' in runbook.lower()
          # Current authorities must retain durable/incremental evidence semantics;
          # exact wording may evolve, so CI must validate the invariant rather than
          # permanently pin a historical prompt version/string.
          combined=(start+'\n'+master+'\n'+readme).lower()
          assert 'seven-stage' in combined or 'seven stage' in combined
          assert 'git-backed' in combined
          assert 'incremental' in combined and ('refetch' in combined or 'cache' in combined)
          if 'v3.1.13' in start_path.name or 'product-floor' in combined or 'product floor' in combined:
              assert 'GERMAN-RICH-CARD-PRODUCT-FLOOR-v1.0.0.json' in start
              assert Path('Verification/validate_rich_card_product_floor_v1_0_0.py').is_file()
          print('PASS active entrypoint consistency',start_path,master_path)
          PY
