      - 'Verification/tests-v3.3.6/test_a2_l24_stage123_lineage.py'
      - 'Verification/validate_stage3_stage4_unification.py'
      - 'Verification/verify_stage34_materialized_output.py'
      - 'Verification/audit_wip50_mixed_canonical_import_scope.py'
      - 'Verification/tests-v3.3.6/test_wip50_mixed_canonical_import_scope.py'
      - 'Verification/tests-v3.3.6/test_stage34_materialized_output.py'
      - 'Verification/tests-v3.3.6/test_stage3_stage4_unification.py'
      - 'Verification/validate_applied_edit_bytes.py'
      - 'Verification/test_applied_edit_bytes.py'
      - 'Optimization-Program/WRITER-SCOPES.json'
      - 'Verification/persist_verified_git_edit.py'
      - 'Verification/test_persist_verified_git_edit.py'
      - '.github/workflows/stage3-4-compatibility.yml'
  pull_request:
    paths:
      - 'Architecture/Stage3-Stage4-Unification/**'
      - 'Verification/audit_stage5_input_role_binding.py'
      - 'Verification/audit_stage5_current_authority.py'
      - 'Verification/plan_stage5_current_adoption.py'
      - 'Verification/audit_aber_hallo_current_identity.py'
      - 'Verification/audit_stage4_current_worksheet_freshness.py'
      - 'Verification/audit_stage4_snapshot_review_receipt.py'
      - 'Verification/tests-v3.3.6/test_stage4_snapshot_review_receipt.py'
      - 'Verification/tests-v3.3.6/test_stage4_current_worksheet_freshness.py'
      - 'Verification/tests-v3.3.6/test_aber_hallo_current_identity.py'
      - 'Workspaces/aber-hallo-listen-tabellen/LATEST.json'
      - 'Workspaces/aber-hallo-listen-tabellen/00-source/SOURCE-MANIFEST.json'
      - 'Verification/tests-v3.3.6/test_stage5_current_adoption.py'
      - 'Verification/tests-v3.3.6/test_stage5_current_authority.py'
      - 'Verification/tests-v3.3.6/test_stage5_input_role_binding.py'
      - 'Verification/audit_stage5_clean_zip_v486.py'
      - 'Verification/tests-v3.3.6/test_stage5_clean_zip_v486.py'
      - 'Tools/build_clean_delivery.py'
      - 'Tools/content_package_guard.py'
      - 'Verification/validate_stage45_v486_consumer_bridge.py'
      - 'Verification/tests-v3.3.6/test_stage45_v486_consumer_bridge.py'
      - 'Verification/validate_stage45_teaching_delta_parity.py'
      - 'Verification/tests-v3.3.6/test_stage45_teaching_delta_parity.py'
      - 'Verification/validate_stage3c_proof_binding.py'
      - 'Verification/tests-v3.3.6/test_stage3c_proof_binding.py'
      - 'Verification/audit_a2_l24_archived_proof_and_combos.py'
      - 'Verification/tests-v3.3.6/test_a2_l24_archived_proof_and_combos.py'
      - 'Verification/audit_a2_l24_stage123_lineage.py'
      - 'Verification/tests-v3.3.6/test_a2_l24_stage123_lineage.py'
      - 'Verification/validate_stage3_stage4_unification.py'
      - 'Verification/verify_stage34_materialized_output.py'
      - 'Verification/audit_wip50_mixed_canonical_import_scope.py'
      - 'Verification/tests-v3.3.6/test_wip50_mixed_canonical_import_scope.py'
      - 'Verification/tests-v3.3.6/test_stage34_materialized_output.py'
      - 'Verification/tests-v3.3.6/test_stage3_stage4_unification.py'
      - 'Verification/validate_applied_edit_bytes.py'
      - 'Verification/test_applied_edit_bytes.py'
      - 'Optimization-Program/WRITER-SCOPES.json'
      - 'Verification/persist_verified_git_edit.py'
      - 'Verification/test_persist_verified_git_edit.py'
      - '.github/workflows/stage3-4-compatibility.yml'
  workflow_dispatch:
jobs:
  metadata-compatibility-only:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile without creating ZIPs
        run: python -m compileall -q Verification/validate_stage3_stage4_unification.py
      - name: Validate matrix against actual preserved checkpoint schemas
        run: python Verification/validate_stage3_stage4_unification.py
      - name: Verify lexical and grammar ID separation in mixed Canonical/import scopes (synthetic)
        run: python -m pytest -vv Verification/tests-v3.3.6/test_wip50_mixed_canonical_import_scope.py
      - name: Bind whole Stage3 output bytes and every unit SHA against external pin (synthetic only)
        run: python -m pytest -vv Verification/tests-v3.3.6/test_stage34_materialized_output.py
      - name: Exercise fail-closed Stage3/Stage4 proposal contract
        run: python -m pytest -q Verification/tests-v3.3.6/test_stage3_stage4_unification.py
      - name: Exercise source/card/provenance tamper fixtures without user ZIP
        run: python -m pytest -q Verification/tests-v3.3.6/test_a2_l24_stage123_lineage.py
      - name: Exercise multi-archive SHA and 64-item shadow didactic QA fixtures
        run: python -m pytest -q Verification/tests-v3.3.6/test_a2_l24_archived_proof_and_combos.py
      - name: Exercise prospective nonactive Stage3C multi-kind exact evidence binding
        run: python -m pytest -q Verification/tests-v3.3.6/test_stage3c_proof_binding.py
      - name: Exercise nonactive Stage4-to-Stage5 teaching delta and exact TSV projection parity
        run: python -m pytest -q Verification/tests-v3.3.6/test_stage45_teaching_delta_parity.py
      - name: Exercise nonactive CURRENT v486 UI consumer projection compatibility (synthetic)
        run: python -m pytest -q Verification/tests-v3.3.6/test_stage45_v486_consumer_bridge.py
      - name: Build actual clean Stage5 ZIP from synthetic input and audit post-package semantic bytes
        run: python -m pytest -q Verification/tests-v3.3.6/test_stage5_clean_zip_v486.py
      - name: Fail closed on ambiguous Stage5 prebuilder role choice and altered finished ZIP
        run: python -m pytest -q Verification/tests-v3.3.6/test_stage5_input_role_binding.py
      - name: Reject valid-but-wrong single CURRENT Stage5 TSV against externally pinned role authority
        run: python -m pytest -q Verification/tests-v3.3.6/test_stage5_current_authority.py
      - name: Verify nonactive CURRENT trust-root and rollback contract (synthetic)
        run: python -m pytest -vv Verification/tests-v3.3.6/test_stage5_current_adoption.py
      - name: Reject replayed, incomplete, self-attested or changed Stage4 per-unit review receipts
        run: python -m pytest -vv Verification/tests-v3.3.6/test_stage4_snapshot_review_receipt.py
      - name: Test read-only Stage4 WIP50 worksheet freshness against synthetic frozen field changes
        run: python -m pytest -vv Verification/tests-v3.3.6/test_stage4_current_worksheet_freshness.py
      - name: Check real Aber Hallo native LATEST, receipt and source metadata (read-only)
        run: python -m pytest -vv Verification/tests-v3.3.6/test_aber_hallo_current_identity.py
      - name: Reject report-only APPLIED and unverified CURRENT readbacks
        run: python -B -m unittest discover -s Verification -p test_applied_edit_bytes.py
      - name: Exercise opt-in remote Git CAS writer with synthetic transport only
        run: python -B -m unittest discover -s Verification -p test_persist_verified_git_edit.py
