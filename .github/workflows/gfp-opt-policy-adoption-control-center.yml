name: GFP-OPT Policy Adoption Control Center
on:
  push:
    paths:
      - 'Optimization-Program/Control-Center/**'
      - 'Optimization-Program/Verification/P1-REAL-LIVE-CONNECTOR-R8-NONADOPTION-20261105.json'
      - 'Prompt/GLOBAL-POLICY-REGISTRY-v1.0.0.json'
      - 'Tools/build_policy_adoption_control_center_v1.py'
      - 'Tools/build_domain_adapter_preflight_v1.py'
      - 'Verification/tests/test_domain_adapter_preflight_v1.py'
      - 'Optimization-Program/Control-Center/ROOT-CHECKPOINT-BRANCH-CANDIDATES-v1.json'
      - 'Verification/reconcile_live_root_checkpoints_v1.py'
      - 'Verification/tests/test_live_root_checkpoint_recovery_v1.py'
      - 'Verification/replay_lesen_stage1_native_v1.py'
      - 'Verification/tests/test_lesen_native_stage1_replay_v1.py'
      - 'Workspaces/lesen-praesentation/**'
      - 'Optimization-Program/RESUME-ROUTES.json'
      - 'SOURCE-REGISTRY.json'
      - 'Verification/audit_op02_typed_envelope_v2.py'
      - 'Tools/plan_central_policy_impact_v1.py'
      - 'Verification/tests/test_policy_adoption_control_center_v1.py'
      - 'PROJECT-STATE.json'
      - 'Workspaces/**'
      - '.github/workflows/gfp-opt-policy-adoption-control-center.yml'
  pull_request:
    paths:
      - 'Optimization-Program/Control-Center/**'
      - 'Optimization-Program/Verification/P1-REAL-LIVE-CONNECTOR-R8-NONADOPTION-20261105.json'
      - 'Prompt/GLOBAL-POLICY-REGISTRY-v1.0.0.json'
      - 'Tools/build_policy_adoption_control_center_v1.py'
      - 'Tools/build_domain_adapter_preflight_v1.py'
      - 'Verification/tests/test_domain_adapter_preflight_v1.py'
      - 'Optimization-Program/Control-Center/ROOT-CHECKPOINT-BRANCH-CANDIDATES-v1.json'
      - 'Verification/reconcile_live_root_checkpoints_v1.py'
      - 'Verification/tests/test_live_root_checkpoint_recovery_v1.py'
      - 'Verification/replay_lesen_stage1_native_v1.py'
      - 'Verification/tests/test_lesen_native_stage1_replay_v1.py'
      - 'Workspaces/lesen-praesentation/**'
      - 'Optimization-Program/RESUME-ROUTES.json'
      - 'SOURCE-REGISTRY.json'
      - 'Verification/audit_op02_typed_envelope_v2.py'
      - 'Tools/plan_central_policy_impact_v1.py'
      - 'Verification/tests/test_policy_adoption_control_center_v1.py'
      - 'PROJECT-STATE.json'
      - 'Workspaces/**'
      - '.github/workflows/gfp-opt-policy-adoption-control-center.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    name: Read-only policy adoption report (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate source-family status and adoption evidence
        run: python -B Tools/build_policy_adoption_control_center_v1.py --output-dir gfp-opt-policy-adoption-output --github-summary
      - name: Test fail-closed no-fake-adoption and source routing
        run: python -B -m unittest discover -s Verification/tests -p test_policy_adoption_control_center_v1.py -v
      - name: Publish status JSON and Markdown
        uses: actions/upload-artifact@v4
        with:
          name: gfp-opt-policy-status-${{ matrix.os }}
          path: gfp-opt-policy-adoption-output/
          if-no-files-found: error
          retention-days: 30
