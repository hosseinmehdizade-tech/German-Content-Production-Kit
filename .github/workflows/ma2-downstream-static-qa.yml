name: Menschen A2 downstream static QA

on:
  push:
    branches: [repair/menschen-a2-downstream-v1]
    paths:
      - '.github/workflows/ma2-downstream-static-qa.yml'
      - '.github/workflows/ma2-stages4-7-rich-repair.yml'
      - '.github/workflows/ma2-downstream-runtime-smoke.yml'
      - '.github/workflows/ma2-stage7-rich-release-v2.yml'
      - 'Verification/validate_enriched_canonical_v1_0_0.py'
      - 'Verification/validate_rich_card_product_floor_v1_0_0.py'
      - 'Verification/test_rich_card_product_floor_v1_0_0.py'
      - 'Verification/test_menschen_a2_residual_external_examples_v1.py'
      - 'Workspaces/menschen-a2/tools/apply_residual_external_examples_v1.py'
      - 'Workspaces/menschen-a2/tools/RESIDUAL-EXTERNAL-EXAMPLES-v1.json'
      - 'Workspaces/menschen-a2/tools/GENERATED-PRIMARY-REPLACEMENTS-v1.json'
      - 'Workspaces/menschen-a2/tools/runtime_acceptance_rich_v2.py'
      - 'Workspaces/menschen-a2/tools/package_release_rich_v2.py'
      - 'Prompt/START-PROMPT-v3.1.13.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/menschen-a2-downstream-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python repair tools
        run: |
          python -m py_compile \
            Verification/validate_enriched_canonical_v1_0_0.py \
            Verification/validate_rich_card_product_floor_v1_0_0.py \
            Verification/test_rich_card_product_floor_v1_0_0.py \
            Verification/test_menschen_a2_residual_external_examples_v1.py \
            Workspaces/menschen-a2/tools/apply_residual_external_examples_v1.py \
            Workspaces/menschen-a2/tools/runtime_acceptance_rich_v2.py \
            Workspaces/menschen-a2/tools/package_release_rich_v2.py \
            Workspaces/menschen-a2/tools/project_universal_v2_rich.py \
            Workspaces/menschen-a2/tools/delivery_loss_check.py \
            Workspaces/menschen-a2/tools/linguistic_qa_v2.py \
            Verification/validate_lexical_quality_v1_0_2.py
      - name: Run product-floor and residual-evidence regressions
        run: |
          python Verification/test_rich_card_product_floor_v1_0_0.py
          python Verification/test_menschen_a2_residual_external_examples_v1.py
      - name: Parse downstream workflow YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import pathlib,yaml
          files=[
            '.github/workflows/ma2-stages4-7-rich-repair.yml',
            '.github/workflows/ma2-downstream-runtime-smoke.yml',
            '.github/workflows/ma2-stage7-rich-release-v2.yml',
            '.github/workflows/ma2-downstream-static-qa.yml',
          ]
          for rel in files:
              p=pathlib.Path(rel);data=yaml.safe_load(p.read_text(encoding='utf-8'))
              assert isinstance(data,dict) and 'jobs' in data,rel
              print('PASS YAML',rel)
          PY
      - name: Verify required downstream files exist
        run: |
          test -s Prompt/START-PROMPT-v3.1.13.md
          test -s Prompt/CONTENT-GENERATION-MASTER-PROMPT-v3.1.13.md
          test -s Prompt/GERMAN-RICH-CARD-PRODUCT-FLOOR-v1.0.0.json
          test -s Verification/validate_rich_card_product_floor_v1_0_0.py
          test -s Verification/test_menschen_a2_residual_external_examples_v1.py
          test -s Workspaces/menschen-a2/tools/apply_residual_external_examples_v1.py
          test -s Workspaces/menschen-a2/tools/RESIDUAL-EXTERNAL-EXAMPLES-v1.json
          test -s Workspaces/menschen-a2/tools/GENERATED-PRIMARY-REPLACEMENTS-v1.json
          test -s Workspaces/menschen-a2/tools/runtime_acceptance_rich_v2.py
          test -s Workspaces/menschen-a2/tools/package_release_rich_v2.py
