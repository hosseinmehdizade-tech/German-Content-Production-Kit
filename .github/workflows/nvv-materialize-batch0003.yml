name: NVV materialize Batch0003 checkpoint

on:
  push:
    branches: [nvv-production]
    paths:
      - 'Workspaces/nomen-verb-verbindungen/_materialize-batch0003/READY-BATCH0003-FINAL.txt'
      - '.github/workflows/nvv-materialize-batch0003.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'Materialize NVV Batch0003 final checkpoint snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nvv-production
          fetch-depth: 0

      - name: Recover exact staged payload, verify and materialize
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, shutil, tempfile, zipfile, os

          root = Path('Workspaces/nomen-verb-verbindungen')
          stage = root / '_materialize-batch0003'
          ready = stage / 'READY-BATCH0003-FINAL.txt'
          release = root / '07-release'
          release.mkdir(parents=True, exist_ok=True)
          out_zip = release / 'NVV-Production-Checkpoint-Batch0003-FINAL.zip'
          side = release / 'NVV-Production-Checkpoint-Batch0003-FINAL.zip.sha256'
          report_path = release / 'MATERIALIZATION-REPORT-BATCH0003-FINAL.json'

          expected = ''
          mission_id = ''
          for line in ready.read_text(encoding='utf-8').splitlines():
              if line.startswith('sha256='):
                  expected = line.split('=', 1)[1].strip()
              elif line.startswith('mission_id='):
                  mission_id = line.split('=', 1)[1].strip()
          if not expected:
              raise SystemExit('READY marker has no sha256')

          def cleaned(p: Path) -> str:
              return ''.join(p.read_text(encoding='utf-8').split())

          def files(*names):
              ps = [stage / n for n in names]
              return ps if all(p.is_file() for p in ps) else []

          candidates = []
          final_named = sorted(stage.glob('finalchunk*.b64'))
          if final_named:
              candidates.append(('finalchunk_glob', final_named))

          c = files('finalchunk000.b64','finalchunk001.b64','finalchunk002.b64','finalchunk003.b64','finalchunk004.b64','tailA00.b64','tailA01.b64')
          if c:
              candidates.append(('final_000_004_plus_tailA00_tailA01', c))

          c = files('finalchunk000.b64','finalchunk001.b64','finalchunk002.b64','finalchunk003.b64','finalchunk004.b64','tail00.b64')
          if c:
              candidates.append(('final_000_004_plus_tail00', c))

          c = files('chunk000.b64','chunk001.b64','chunk002.b64','chunk003.b64','chunk004a.b64','chunk004b.b64','chunk005.b64','tail00.b64')
          if c:
              candidates.append(('legacy_split004_plus_chunk005_tail00', c))

          c = files('chunk000.b64','chunk001.b64','chunk002.b64','chunk003.b64','chunk004.b64','chunk005.b64','tail00.b64')
          if c:
              candidates.append(('legacy_chunk004_plus_chunk005_tail00', c))

          report = {
              'schema': 'nvv-materialization-report@1.2.0',
              'batch': '0003',
              'mission_id': mission_id,
              'expected_zip_sha256': expected,
              'candidate_results': [],
              'status': 'FAIL',
          }

          matched_payload = None
          matched_name = None
          matched_files = None
          for name, ps in candidates:
              item = {
                  'name': name,
                  'files': [p.name for p in ps],
                  'file_sizes': [p.stat().st_size for p in ps],
              }
              try:
                  encoded = ''.join(cleaned(p) for p in ps)
                  item['encoded_length'] = len(encoded)
                  item['encoded_length_mod4'] = len(encoded) % 4
                  payload = base64.b64decode(encoded, validate=True)
                  got = hashlib.sha256(payload).hexdigest()
                  item['decoded_bytes'] = len(payload)
                  item['sha256'] = got
                  item['matches_expected'] = got == expected
                  if got == expected and matched_payload is None:
                      matched_payload = payload
                      matched_name = name
                      matched_files = [p.name for p in ps]
              except Exception as exc:
                  item['decode_error'] = str(exc)
                  item['matches_expected'] = False
              report['candidate_results'].append(item)

          try:
              if matched_payload is None:
                  raise RuntimeError('none of the staged candidate compositions matches the READY SHA-256')

              actual = hashlib.sha256(matched_payload).hexdigest()
              report['matched_candidate'] = matched_name
              report['matched_files'] = matched_files
              report['actual_zip_sha256'] = actual
              report['zip_bytes'] = len(matched_payload)
              out_zip.write_bytes(matched_payload)
              side.write_text(f'{actual}  {out_zip.name}\n', encoding='utf-8')

              with tempfile.TemporaryDirectory() as td:
                  tmp = Path(td)
                  with zipfile.ZipFile(out_zip) as zf:
                      bad = zf.testzip()
                      report['zip_member_count'] = len(zf.infolist())
                      report['zip_test'] = 'PASS' if bad is None else f'FAIL:{bad}'
                      if bad is not None:
                          raise RuntimeError(f'ZIP CRC failure: {bad}')
                      zf.extractall(tmp)

                  sums = tmp / '07-release' / 'SHA256SUMS-BATCH0003.txt'
                  if not sums.is_file():
                      raise RuntimeError('missing extracted 07-release/SHA256SUMS-BATCH0003.txt')

                  verified = 0
                  for raw in sums.read_text(encoding='utf-8').splitlines():
                      raw = raw.strip()
                      if not raw:
                          continue
                      parts = raw.split(None, 1)
                      if len(parts) != 2:
                          raise RuntimeError(f'malformed SHA256 manifest line: {raw!r}')
                      sha, rel = parts
                      rel = rel.strip().lstrip('*')
                      p = tmp / rel
                      if not p.is_file():
                          raise RuntimeError(f'missing extracted artifact: {rel}')
                      got = hashlib.sha256(p.read_bytes()).hexdigest()
                      if got != sha:
                          raise RuntimeError(f'artifact SHA mismatch: {rel}: {got} != {sha}')
                      verified += 1
                  report['manifest_entries_verified'] = verified
                  report['manifest_status'] = 'PASS'

                  for child in tmp.iterdir():
                      dest = root / child.name
                      if child.is_dir():
                          shutil.copytree(child, dest, dirs_exist_ok=True)
                      else:
                          shutil.copy2(child, dest)

              report['status'] = 'PASS'
              report['note'] = 'Recovered the exact staged Batch0003 FINAL payload by SHA-256, then passed ZIP CRC and all extracted SHA256 manifest entries before materialization.'
          except Exception as exc:
              report['error'] = str(exc)
              report['note'] = 'No Batch0003 PASS promotion is allowed from this recovery attempt. Staging evidence is intentionally retained.'

          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"status={report['status']}\n")
          PY

      - name: Remove staging only after full verification
        if: steps.recover.outputs.status == 'PASS'
        shell: bash
        run: rm -rf Workspaces/nomen-verb-verbindungen/_materialize-batch0003

      - name: Commit recovery result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Workspaces/nomen-verb-verbindungen
          if git diff --cached --quiet; then
            echo 'No recovery changes to commit.'
          else
            if [ '${{ steps.recover.outputs.status }}' = 'PASS' ]; then
              git commit -m 'Materialize NVV Batch0003 final checkpoint snapshot'
            else
              git commit -m 'Record NVV Batch0003 materialization recovery diagnostics'
            fi
            git push origin HEAD:nvv-production
          fi

      - name: Enforce verification gate
        if: steps.recover.outputs.status != 'PASS'
        shell: bash
        run: |
          echo 'Batch0003 FINAL materialization did not pass verification. Diagnostic report was persisted; no PASS promotion occurred.'
          exit 1
