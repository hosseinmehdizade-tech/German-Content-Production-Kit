name: MA2 Wiktionary DOM diagnostic
on:
  push:
    branches: [repair/menschen-a2-rich-card-floor]
    paths: ['.github/workflows/ma2-wiki-dom-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup,Tag
          for url in ['https://de.wiktionary.org/wiki/klettern','https://de.wiktionary.org/w/index.php?title=klettern&useparsoid=0']:
            print('\nURL',url)
            html=requests.get(url,headers={'User-Agent':'GFP diagnostic'},timeout=20).text
            s=BeautifulSoup(html,'html.parser')
            hits=s.find_all(string=re.compile(r'^\s*(Bedeutungen|Charakteristische Wortkombinationen|Sinnverwandte Wörter|Synonyme|Gegenwörter)\s*:?\s*$',re.I))
            print('HITS',len(hits))
            for h in hits[:12]:
              p=h.parent
              print('TEXT=',repr(h.strip()),'PARENT=',p.name,'CLASS=',p.get('class'),'ID=',p.get('id'))
              print('PARENT_HTML=',str(p)[:1200])
              for sib in list(p.next_siblings)[:5]:
                if isinstance(sib,Tag): print(' NEXT',sib.name,sib.get('class'),repr(sib.get_text(' ',strip=True))[:500])
              pp=p.parent
              print('GRAND=',pp.name,pp.get('class'),'HTML=',str(pp)[:1800])
          PY
