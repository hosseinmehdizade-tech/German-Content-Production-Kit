name: MA2 Verbformen DOM diagnostic
on:
  push:
    branches: [repair/menschen-a2-rich-card-floor-v8]
    paths: ['.github/workflows/ma2-verbformen-dom-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup,Tag
          url='https://www.verbformen.de/konjugation/beispiele/kuscheln.htm'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=20);print('HTTP',r.status_code,len(r.text))
          s=BeautifulSoup(r.text,'html.parser')
          for node in s.find_all(string=re.compile('kuschel',re.I)):
            p=node.parent
            txt=p.get_text(' ',strip=True)
            if 8<len(txt)<500:
              print('NODE',p.name,p.get('class'),repr(txt))
              if p.parent: print('PARENT',p.parent.name,p.parent.get('class'),repr(p.parent.get_text(' ',strip=True))[:700])
          PY
