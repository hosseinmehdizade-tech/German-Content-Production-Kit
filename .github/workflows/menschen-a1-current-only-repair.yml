name: Menschen A1 current-only repair

on:
  push:
    branches: ["repair/menschen-a1-v3.1.10"]
    paths:
      - "Data/Menschen-A1/v3.1.10-repair/enrich_current_only.py"
      - ".github/workflows/menschen-a1-current-only-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/menschen-a1-v3.1.10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Enrich current dataset only
        run: |
          rm -rf Data/Menschen-A1/v3.1.10-final
          python Data/Menschen-A1/v3.1.10-repair/enrich_current_only.py \
            --baseline Data/Menschen-A1/v3.1.9-baseline/MENSCHEN-A1-CANONICAL-CONTENT-VALIDATED.json \
            --profile Architecture/03-PROFILES/MENSCHEN-A1.json \
            --outdir Data/Menschen-A1/v3.1.10-final \
            --delay 0.10
      - name: Product completeness gate
        run: |
          python Verification/validate_content_completeness_v1_0_0.py \
            Data/Menschen-A1/v3.1.10-final/MENSCHEN-A1-CANONICAL-CONTENT-VALIDATED.json \
            Prompt/MENSCHEN-A1-CONTENT-COMPLETENESS-v1.0.0.json \
            --output Data/Menschen-A1/v3.1.10-final/PRODUCT-CONTENT-COMPLETENESS.json || true
      - name: Build final status and package
        run: |
          python - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          out=Path('Data/Menschen-A1/v3.1.10-final')
          gate=json.loads((out/'PRODUCT-CONTENT-COMPLETENESS.json').read_text(encoding='utf-8'))
          enrich=json.loads((out/'CURRENT-ONLY-ENRICHMENT-REPORT.json').read_text(encoding='utf-8'))
          final = gate.get('status')=='PASS'
          status={
            'artifact':'Menschen A1 v3.1.10 current-only enrichment',
            'prompt_version':'v3.1.10','architecture_version':'v3.1.5','semantic_contract':'3.1.3',
            'legacy_inputs_used':False,
            'source_policy':'current baseline + live Duden pages already referenced by current canonical provenance',
            'learning_units':enrich.get('units_total'),'verbs':enrich.get('verbs'),
            'product_content_complete':gate.get('status'),'errors':gate.get('errors'),'warnings':gate.get('warnings'),
            'final_status':'FINAL' if final else 'NOT_FINAL',
            'transport_projection_built':True
          }
          (out/'FINAL-STATUS.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest={'artifact':'menschen-a1-v3.1.10-current-only-package','status':status['final_status'],'files':{}}
          for p in sorted(out.iterdir()):
            if p.is_file() and p.suffix!='.zip':
              manifest['files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'FINAL-PACKAGE-MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          z=out/'Menschen-A1-v3.1.10-CURRENT-ONLY-FINAL.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as f:
            for p in sorted(out.iterdir()):
              if p.is_file() and p!=z:
                f.write(p,p.name)
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/Menschen-A1/v3.1.10-final
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Menschen A1 v3.1.10 current-only output [skip ci]"
            git push origin HEAD:repair/menschen-a1-v3.1.10
          fi
