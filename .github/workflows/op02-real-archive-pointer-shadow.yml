name: OP02 Real Archive Pointer Contract Shadow
on:
  pull_request:
    paths:
      - 'Verification/audit_op02_real_archive_pointer.py'
      - 'Verification/test_op02_real_archive_pointer.py'
      - 'Optimization-Program/Verification/OP02-WIP67-REAL-BINARY-INTERNAL-POINTER-20261030.json'
      - 'Optimization-Program/Verification/OP02-WIP67-BINARY-INTERNAL-POINTER-DECISION-20261030.md'
      - '.github/workflows/op02-real-archive-pointer-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'Verification/audit_op02_real_archive_pointer.py'
      - 'Verification/test_op02_real_archive_pointer.py'
      - 'Optimization-Program/Verification/OP02-WIP67-REAL-BINARY-INTERNAL-POINTER-20261030.json'
      - 'Optimization-Program/Verification/OP02-WIP67-BINARY-INTERNAL-POINTER-DECISION-20261030.md'
      - '.github/workflows/op02-real-archive-pointer-shadow.yml'
permissions:
  contents: read
jobs:
  shadow-archive-integrity:
    name: OP02-ARCHIVE-AND-POINTER-NONREQUIRED-NOT-ISSUER
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run only synthetic archive-guard negative fixtures
        run: python -B -m unittest discover -s Verification -p test_op02_real_archive_pointer.py -v
