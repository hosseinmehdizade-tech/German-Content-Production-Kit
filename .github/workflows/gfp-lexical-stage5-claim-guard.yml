name: GFP Lexical New Stage5 Acceptance Claim Guard
on:
  pull_request:
    paths:
      - 'Workspaces/**'
      - 'Verification/check_new_lexical_stage5_claims_v1.py'
      - 'Verification/check_new_lexical_producer_bypass_v1.py'
      - 'Verification/tests/test_new_lexical_producer_bypass_v1.py'
      - 'Tools/**'
      - '.github/workflows/**'
      - 'Verification/tests/test_new_lexical_stage5_claims_v1.py'
      - 'Tools/build_quality_gated_lexical_candidate_v1.py'
      - '.github/workflows/gfp-lexical-stage5-claim-guard.yml'
  push:
    branches: [main]
    paths:
      - 'Workspaces/**'
      - 'Verification/check_new_lexical_stage5_claims_v1.py'
      - 'Verification/check_new_lexical_producer_bypass_v1.py'
      - 'Verification/tests/test_new_lexical_producer_bypass_v1.py'
      - 'Tools/**'
      - '.github/workflows/**'
      - 'Verification/tests/test_new_lexical_stage5_claims_v1.py'
      - 'Tools/build_quality_gated_lexical_candidate_v1.py'
      - '.github/workflows/gfp-lexical-stage5-claim-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: New Stage5 claim positive and adversarial tests
        run: python -B -m unittest discover -s Verification/tests -p test_new_lexical_stage5_claims_v1.py -v
      - name: Reject new executable legacy lexical producer bypasses (negative tests)
        run: python -B -m unittest discover -s Verification/tests -p test_new_lexical_producer_bypass_v1.py -v
      - name: Verify newly changed lexical acceptance claims and new producer routes
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "Cannot prove full push comparison range; refusing Stage5 acceptance check" >&2
              exit 2
            fi
          fi
          python -B Verification/check_new_lexical_stage5_claims_v1.py --base "$BASE" --head HEAD
          python -B Verification/check_new_lexical_producer_bypass_v1.py --base "$BASE" --head HEAD
      - name: Scope
        run: echo "This guards NEW Stage5 claims and NEW producer entrypoints, not historical replay, branch protection, Library or app Stage6/7."
