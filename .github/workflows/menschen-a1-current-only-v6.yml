name: Menschen A1 current-only v6 build
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  build:
    if: github.event.issue.title == 'RUN:MENSCHEN-A1-CURRENT-ONLY-V6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/menschen-a1-v3.1.10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 spacy
          python -m spacy download de_core_news_sm
      - name: Build current-only dataset
        run: |
          rm -rf Data/Menschen-A1/v3.1.10-final
          python Data/Menschen-A1/v3.1.10-repair/enrich_current_only_v6.py \
            --baseline Data/Menschen-A1/v3.1.9-baseline/MENSCHEN-A1-CANONICAL-CONTENT-VALIDATED.json \
            --profile Architecture/03-PROFILES/MENSCHEN-A1.json \
            --outdir Data/Menschen-A1/v3.1.10-final \
            --delay 0.12
      - name: Completeness gate
        run: |
          set +e
          python Verification/validate_content_completeness_v1_0_0.py \
            Data/Menschen-A1/v3.1.10-final/MENSCHEN-A1-CANONICAL-CONTENT-VALIDATED.json \
            Prompt/MENSCHEN-A1-CONTENT-COMPLETENESS-v1.0.0.json \
            --output Data/Menschen-A1/v3.1.10-final/PRODUCT-CONTENT-COMPLETENESS.json
          exit 0
      - name: Package
        run: |
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          out=Path('Data/Menschen-A1/v3.1.10-final')
          gate=json.loads((out/'PRODUCT-CONTENT-COMPLETENESS.json').read_text())
          rep=json.loads((out/'CURRENT-ONLY-ENRICHMENT-REPORT.json').read_text())
          ok=gate.get('status')=='PASS'
          status={'artifact':'Menschen A1 v3.1.10 current-only enrichment','prompt_version':'v3.1.10','architecture_version':'v3.1.5','semantic_contract':'3.1.3','legacy_inputs_used':False,'input_policy':'Current v3.1.9 canonical baseline + live German Wiktionary + combinations normalized from the same current card examples only','learning_units':rep.get('units_total'),'verbs':rep.get('verbs'),'wiktionary_pages_ok':rep.get('wiktionary_pages_ok'),'wiktionary_pages_failed':rep.get('wiktionary_pages_failed'),'verbs_with_3plus_collocations':rep.get('verbs_with_3plus_collocations'),'collocations_added':rep.get('collocations_added'),'current_example_fallback_verbs':rep.get('current_example_fallback_verbs'),'current_example_collocations_added':rep.get('current_example_collocations_added'),'synonyms_verified_or_added':rep.get('synonyms_verified_or_added'),'antonyms_verified_or_added':rep.get('antonyms_verified_or_added'),'current_rection_claims_added':rep.get('current_rection_claims_added'),'product_content_complete':gate.get('status'),'errors':gate.get('errors'),'warnings':gate.get('warnings'),'final_status':'FINAL' if ok else 'NOT_FINAL','transport_projection_built':True}
          (out/'FINAL-STATUS.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          manifest={'artifact':'menschen-a1-v3.1.10-current-only-package','status':status['final_status'],'files':{}}
          for p in sorted(out.iterdir()):
            if p.is_file() and p.suffix!='.zip': manifest['files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'FINAL-PACKAGE-MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          z=out/'Menschen-A1-v3.1.10-CURRENT-ONLY-FINAL.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as f:
            for p in sorted(out.iterdir()):
              if p.is_file() and p!=z: f.write(p,p.name)
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY
      - name: Commit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Data/Menschen-A1/v3.1.10-final
          if ! git diff --cached --quiet; then
            git commit -m 'Build Menschen A1 v3.1.10 current-only v6 [skip ci]'
            git push origin HEAD:repair/menschen-a1-v3.1.10
          fi
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('Data/Menschen-A1/v3.1.10-final/FINAL-STATUS.json'))['final_status'])")
          gh issue comment "${{ github.event.issue.number }}" --body "Current-only v6 build finished: **${STATUS}**. No legacy enrichment input was used."
