name: OP-04 Resume route integrity
on:
  push:
    paths:
      - 'PROJECT-STATE.json'
      - 'Workspaces/*/LATEST.json'
      - 'Tools/build_resume_routes.py'
      - 'Optimization-Program/RESUME-ROUTES.json'
      - '.github/workflows/op04-resume-routes.yml'
      - 'PROJECT-BOOTSTRAP.md'
      - 'EXECUTION-OUTCOME-EFFICIENCY-POLICY.json'
      - 'Optimization-Program/README.md'
      - 'Optimization-Program/STATE.json'
      - 'Verification/test_mission_continuity_contract.py'
  pull_request:
    paths:
      - 'PROJECT-STATE.json'
      - 'Workspaces/*/LATEST.json'
      - 'Tools/build_resume_routes.py'
      - 'Optimization-Program/RESUME-ROUTES.json'
      - '.github/workflows/op04-resume-routes.yml'
      - 'PROJECT-BOOTSTRAP.md'
      - 'EXECUTION-OUTCOME-EFFICIENCY-POLICY.json'
      - 'Optimization-Program/README.md'
      - 'Optimization-Program/STATE.json'
      - 'Verification/test_mission_continuity_contract.py'
  workflow_dispatch:

jobs:
  route-index:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and route consistency
        run: python -B Tools/build_resume_routes.py --check
      - name: Verify user mission scope and prevent content pivot
        run: python -B -m unittest discover -s Verification -p test_mission_continuity_contract.py
