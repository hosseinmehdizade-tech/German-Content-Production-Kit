name: Menschen A1 current-only FINAL v9
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  build:
    if: github.event.issue.title == 'RUN:MENSCHEN-A1-CURRENT-ONLY-FINAL-V9'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/menschen-a1-v3.1.10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 spacy
          python -m spacy download de_core_news_sm
      - name: Build current-only final dataset
        run: |
          rm -rf Data/Menschen-A1/v3.1.10-final
          python Data/Menschen-A1/v3.1.10-repair/enrich_current_only_v9.py \
            --baseline Data/Menschen-A1/v3.1.9-baseline/MENSCHEN-A1-CANONICAL-CONTENT-VALIDATED.json \
            --profile Architecture/03-PROFILES/MENSCHEN-A1.json \
            --outdir Data/Menschen-A1/v3.1.10-final \
            --delay 0.04
      - name: Product completeness gate (capture report)
        run: |
          python Verification/validate_content_completeness_v1_0_0.py \
            Data/Menschen-A1/v3.1.10-final/MENSCHEN-A1-CANONICAL-CONTENT-VALIDATED.json \
            Prompt/MENSCHEN-A1-CONTENT-COMPLETENESS-v1.0.0.json \
            --output Data/Menschen-A1/v3.1.10-final/PRODUCT-CONTENT-COMPLETENESS.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('Data/Menschen-A1/v3.1.10-final/PRODUCT-CONTENT-COMPLETENESS.json')
          report=json.loads(src.read_text(encoding='utf-8'))
          issues=report.get('issues',[])
          hard=[x for x in issues if str(x.get('severity','')).lower()=='error']
          diag={
            'source':'v3.1.10-final/PRODUCT-CONTENT-COMPLETENESS.json',
            'status':report.get('status'),
            'errors':report.get('errors'),
            'warnings':report.get('warnings'),
            'hard_errors':hard,
          }
          dst=Path('Data/Menschen-A1/v3.1.10-repair/LATEST-PRODUCT-GATE-DIAGNOSTIC.json')
          dst.write_text(json.dumps(diag,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(diag,ensure_ascii=False,indent=2))
          PY
      - name: Persist product-gate diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Data/Menschen-A1/v3.1.10-repair/LATEST-PRODUCT-GATE-DIAGNOSTIC.json
          if ! git diff --cached --quiet; then
            git commit -m 'Capture Menschen A1 v3.1.10 product-gate diagnostic [skip ci]'
            git push origin HEAD:repair/menschen-a1-v3.1.10
          fi
      - name: Enforce product completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('Data/Menschen-A1/v3.1.10-final/PRODUCT-CONTENT-COMPLETENESS.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          if r.get('status')!='PASS':
            raise SystemExit(f"Product completeness failed: errors={r.get('errors')} warnings={r.get('warnings')}")
          PY
      - name: Fresh structural and delivery verification
        run: |
          python Data/Menschen-A1/v3.1.10-repair/verify_current_only_final.py Data/Menschen-A1/v3.1.10-final
      - name: Finalize metadata and package
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          out=Path('Data/Menschen-A1/v3.1.10-final')
          gate=json.loads((out/'PRODUCT-CONTENT-COMPLETENESS.json').read_text(encoding='utf-8'))
          full=json.loads((out/'FULL-GATE-VALIDATION.json').read_text(encoding='utf-8'))
          delivery=json.loads((out/'DELIVERY-VALIDATION.json').read_text(encoding='utf-8'))
          rep=json.loads((out/'CURRENT-ONLY-ENRICHMENT-REPORT.json').read_text(encoding='utf-8'))
          ok=gate['status']=='PASS' and full['status']=='PASS' and delivery['status']=='PASS'
          status={
            'artifact':'Menschen A1 v3.1.10 current-only FINAL','prompt_version':'v3.1.10','architecture_version':'v3.1.5','semantic_contract':'3.1.3',
            'legacy_inputs_used':False,
            'input_policy':'Current canonical baseline as repair target + live German Wiktionary + combinations normalized only from the same current card examples + grammar decoding only from current headwords. No legacy enrichment/NVV/mapping artifacts.',
            'learning_units':rep.get('units_total'),'verbs':rep.get('verbs'),'verbs_with_3plus_collocations':rep.get('verbs_with_3plus_collocations'),
            'product_content_complete':gate['status'],'product_errors':gate['errors'],'product_warnings':gate['warnings'],
            'full_gate':full['status'],'delivery_validation':delivery['status'],'deep_canonical_parity_rows':delivery['deep_canonical_parity_rows'],'example_parity_rows':delivery['example_parity_rows'],
            'final_status':'FINAL' if ok else 'NOT_FINAL'
          }
          (out/'FINAL-STATUS.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          manifest={'artifact':'menschen-a1-v3.1.10-current-only-final-package','status':status['final_status'],'manifest_scope':'all payload files except manifest and ZIP container','files':{}}
          for p in sorted(out.iterdir()):
            if p.is_file() and p.name not in {'FINAL-PACKAGE-MANIFEST.json','Menschen-A1-v3.1.10-CURRENT-ONLY-FINAL.zip'}:
              manifest['files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'FINAL-PACKAGE-MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          z=out/'Menschen-A1-v3.1.10-CURRENT-ONLY-FINAL.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as f:
            for p in sorted(out.iterdir()):
              if p.is_file() and p!=z: f.write(p,p.name)
          print(json.dumps(status,ensure_ascii=False,indent=2))
          if not ok: raise SystemExit(1)
          PY
      - name: Commit verified final output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Data/Menschen-A1/v3.1.10-final
          git commit -m 'Release verified Menschen A1 v3.1.10 current-only FINAL [skip ci]'
          git push origin HEAD:repair/menschen-a1-v3.1.10
      - name: Upload verified ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Menschen-A1-v3.1.10-CURRENT-ONLY-FINAL
          path: Data/Menschen-A1/v3.1.10-final/Menschen-A1-v3.1.10-CURRENT-ONLY-FINAL.zip
          if-no-files-found: error
      - name: Report final status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Verified current-only build finished: **FINAL**. Product completeness, fresh structural gate, and delivery/deep-parity validation all PASS. No legacy enrichment/NVV/mapping artifacts were used."
