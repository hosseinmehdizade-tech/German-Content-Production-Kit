# OP-01 / OP-02 — review-only experiment, NOT an active required branch check.
# A branch ruleset must not require this job without separately approved
# security settings, observed docs-only PR checks and owner recovery procedure.
name: OP-01 always-on PR governance pilot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  op01-governance-preflight:
    name: op01-governance-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # MALICIOUS HEAD SIMULATION — isolated unmerged security test only.
      # Intentionally omits the DENY_ALL check while keeping the exact same
      # job/check name and green exit code. Do not merge this change.
      - name: UNSAFE PR HEAD SIMULATION -- bypass all policy checks
        shell: bash
        run: |
          echo "OP01_WORKFLOW_BYPASS_PROBE_NONAUTHORITATIVE"
          echo "This green job deliberately DID NOT validate DENY_ALL."
