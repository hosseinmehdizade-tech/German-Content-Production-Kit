name: Content ZIP safety regression
on:
  push:
    branches: [main]
    paths:
      - 'Tools/content_package_guard.py'
      - 'Tools/build_clean_delivery.py'
      - 'Workspaces/menschen-a2/tools/package_release.py'
      - 'Workspaces/menschen-a2/tools/package_release_corrective.py'
      - 'Verification/tests-v3.3.6/test_content_zip_guard.py'
      - '.github/workflows/content-zip-guard.yml'
  pull_request:
    paths:
      - 'Tools/content_package_guard.py'
      - 'Tools/build_clean_delivery.py'
      - 'Workspaces/menschen-a2/tools/package_release*.py'
      - 'Verification/tests-v3.3.6/test_content_zip_guard.py'
      - '.github/workflows/content-zip-guard.yml'
jobs:
  safe-packaging:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile integrated tools
        run: python -m compileall -q Tools/content_package_guard.py Tools/build_clean_delivery.py Workspaces/menschen-a2/tools/package_release.py Workspaces/menschen-a2/tools/package_release_corrective.py
      - name: ZIP guard regression
        run: python -m pytest -q Verification/tests-v3.3.6/test_content_zip_guard.py
